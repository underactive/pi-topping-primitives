name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The exact `22.19.0` floor, not `22`, is deliberate: it is the engine the packages
        # declare, so an API that needs a newer runtime fails here instead of in a consumer.
        node: ["22.19.0", "24"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Steps 2-9 map one-to-one onto Phase 0 step 3 of HANDOFF_PRIMITIVES.md: typecheck, source
      # tests, build, exports tests under `-C compiled`, and `npm pack --dry-run` to prove `files`,
      # plus the repo-level lint and root tests that guard the shared tooling.
      #
      # They are enumerated rather than being one `npm run check` call because the phase requires
      # each observable to fail under its own name. The cost is that this list must be kept in step
      # with the root `check` script by hand: a guard added there does not reach CI by itself.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:repo
      - run: npm run test:src --workspaces
      - run: npm run build --workspaces
      - run: npm run typecheck:exports --workspaces
      - run: npm run test:exports --workspaces
      # `scripts/check-release.ts` is intentionally absent: it fails while the subpaths are Phase 0
      # stubs, and it is wired to `prepublishOnly` instead of to CI.
      - run: npm run check:pack

  # Advisory only: a pi prerelease that breaks these packages must not block a release of them.
  host-latest:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save @earendil-works/pi-ai@latest @earendil-works/pi-coding-agent@latest @earendil-works/pi-tui@latest
      - run: npm run typecheck
      - run: npm test
